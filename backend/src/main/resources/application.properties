# ─────────────────────────────────────────────────────────────────
# Cross-Border Data Transfer Manager — Spring Boot Backend
# ─────────────────────────────────────────────────────────────────

# Server port
server.port=8080

# Application name
spring.application.name=cross-border-backend

# ─────────────────────────────────────────────────────────────────
# AI Service URL
# Override in Docker via env var: AI_SERVICE_URL=http://ai-service:5000
# ─────────────────────────────────────────────────────────────────
ai.service.base-url=${AI_SERVICE_URL:http://localhost:5000}

# ─────────────────────────────────────────────────────────────────
# Actuator health check
# ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ─────────────────────────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────────────────────────
logging.level.com.internship.tool=DEBUG
logging.level.org.springframework.web=INFO
