# ─────────────────────────────────────────────────────────────────
# Vendor NDA Tracker — Spring Boot Backend Configuration
# ─────────────────────────────────────────────────────────────────

# Server port
server.port=8080

# Application name
spring.application.name=vendor-nda-backend

# ─────────────────────────────────────────────────────────────────
# AI Service URL
# Override this in production with the Docker service name:
#   ai.service.base-url=http://ai-service:5000
# ─────────────────────────────────────────────────────────────────
ai.service.base-url=http://127.0.0.1:5000

# ─────────────────────────────────────────────────────────────────
# Actuator health check
# ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ─────────────────────────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────────────────────────
logging.level.com.vendor.backend=DEBUG
logging.level.org.springframework.web=INFO
